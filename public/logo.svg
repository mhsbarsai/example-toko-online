<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="cShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer Black Circle Ring -->
  <circle cx="250" cy="250" r="236" fill="#ffffff" stroke="#121619" stroke-width="18" />

  <!-- Stylized C Symbol with Sparkle -->
  <g filter="url(#cShadow)" fill="url(#cOrangeGrad)">
    <!-- Main Sweeping Outer C -->
    <path d="
      M 370 120 
      C 415 155, 410 205, 360 195 
      C 325 188, 305 135, 245 115 
      C 175 92, 105 145, 95 235 
      C 85 325, 145 405, 235 425 
      C 315 443, 385 395, 405 335 
      C 415 295, 370 285, 345 320 
      C 325 350, 285 385, 225 375 
      C 165 365, 135 305, 140 245 
      C 145 185, 185 140, 245 140 
      C 275 140, 300 155, 320 175 
      Z
    " />

    <!-- Inner Top Swoosh Curve -->
    <path d="
      M 135 210
      C 150 150, 200 95, 290 75
      C 365 58, 410 105, 375 155
      C 345 195, 295 155, 260 130
      C 220 100, 170 130, 150 180
      Z
    " />

    <!-- Four-Point Star Sparkle Feature -->
    <path d="
      M 260 110
      Q 285 150 300 155
      Q 280 170 270 210
      Q 255 170 235 155
      Q 255 145 260 110
      Z
    " />
  </g>
</svg>
